---
galaxy_info:
  role_name: ansible_role_etc_hosts
  author: "iamenr0s"
  description: "Manage /etc/hosts: update localhost and add inventory/extra hosts."
  license: MIT
  min_ansible_version: "2.9"
  platforms:
    # Rocky Linux is covered by "EL" here: ansible-lint's schema[meta] rule
    # only accepts Vagrant-box-style versions (6.1/7.1/7.2/all) for a
    # "Rocky"/"RockyLinux" platform name, not plain major versions like "8".
    - name: "EL"
      versions:
        - "8"
        - "9"
        - "10"
    - name: "AlmaLinux"
      versions:
        - "8"
        - "9"
        - "10"
    - name: "Fedora"
      versions:
        - "42"
        - "43"
        - "44"
    - name: "Debian"
      versions:
        - "bookworm"
        - "trixie"
    - name: "Ubuntu"
      versions:
        - "jammy"
        - "noble"
  galaxy_tags:
    - networking
    - hosts
    - system
    - etchosts

dependencies: []
collections: []
