---

role_name_check: 1
dependency:
  name: galaxy
  options:
    ignore-errors: true
driver:
  name: podman
platforms:
  - name: instance
    image: "iamenr0s/docker-${MOLECULE_DISTRO:-almalinux9}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    extra_opts: ["--cgroupns=host"]
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    hosts:
      instance_group:
        hosts:
          instance:
            etc_hosts_ip: "10.0.0.99"
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
    prepare: prepare.yml
